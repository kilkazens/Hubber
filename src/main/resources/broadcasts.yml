# ======================================================== #
#              1. Join Broadcast (On Player Join)          #
# ======================================================== #
# Announcement sent when a player joins the hub server
join_broadcast:
  # Master toggle for join broadcast (default: false)
  enabled: false

  # Who receives the announcement:
  # "PLAYER" = send only to the player who joined (private welcome)
  # "ALL"    = broadcast to everyone on the hub server
  send_to: "PLAYER"

  # Delay in ticks before sending after join (20 ticks = 1 second)
  # Recommended: 10-20 ticks so the player finishes loading into the world
  delay_ticks: 15

  # Play a sound when the message is sent
  play_sound: true
  sound: "entity.player.levelup"

  # Message lines (supports & and &#RRGGBB / <#RRGGBB> HEX colors)
  # Available placeholders: {player} (player's name), {online} (online players count)
  # Use [Button Text] anywhere to make an interactive clickable button!
  messages:
    - "&8&m----------------------------------------"
    - "&#FFD700&l          WELCOME TO THE SERVER!"
    - "&fWelcome, &#00FF7F{player}&f! Glad to see you in the hub."
    - "&7Use the book in your hotbar or click the button below"
    - "&7to connect to the main survival server:"
    - "&#00FF7F&l[Click here to connect to the Main Server]"
    - "&8&m----------------------------------------"

  # Optional interactive button action (for [Button] in messages)
  # Supported actions: OPEN_URL, RUN_COMMAND, SUGGEST_COMMAND, COPY_TO_CLIPBOARD
  click_action: "RUN_COMMAND"
  click_value: "/joinserver"
  hover_text: "&#00FF7F&lClick to run /joinserver"

# ======================================================== #
#           2. Periodic Promotional Auto-Broadcasts        #
# ======================================================== #
# Master toggle for scheduled auto-broadcasts (default: false)
enabled: false

# Interval between broadcasts in seconds (e.g. 120 = every 2 minutes)
interval_seconds: 120

# Order of broadcasts:
# false = sequential (in the order defined below)
# true  = random selection
random: false

# Play a chime sound when a broadcast is sent
play_sound: true
sound: "entity.experience_orb.pickup"

# Configured periodic broadcasts
broadcasts:
  discord:
    messages:
      - "&8&m----------------------------------------"
      - "&#5865F2&l          DISCORD COMMUNITY"
      - "&fJoin our official Discord community for news,"
      - "&fevents, support, and discussions!"
      - "&#5865F2&l[Click here to join our Discord server]"
      - "&8&m----------------------------------------"
    click_action: "OPEN_URL"
    click_value: "https://discord.gg/yourserver"
    hover_text: "&#00FF7F&lClick to open Discord invite in your browser"

  store:
    messages:
      - "&8&m----------------------------------------"
      - "&#FFD700&l           SERVER STORE & RANKS"
      - "&fSupport our project and unlock exclusive ranks,"
      - "&fcosmetics, and unique gameplay perks!"
      - "&#FFD700&l[Click here to visit our Store]"
      - "&8&m----------------------------------------"
    click_action: "OPEN_URL"
    click_value: "https://store.myserver.com"
    hover_text: "&#FFD700&lClick to browse privileges in web store"

  connect:
    messages:
      - "&8&m----------------------------------------"
      - "&#00FF7F&l           PLAY ON MAIN SERVER"
      - "&fReady to dive into our survival world?"
      - "&fUse the book in your hotbar or click below:"
      - "&#00FF7F&l[Click here to connect to the Main Server]"
      - "&8&m----------------------------------------"
    click_action: "RUN_COMMAND"
    click_value: "/joinserver"
    hover_text: "&#00FF7F&lClick to instantly connect to the main server"
